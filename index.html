<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel Carlos — Apps</title>
<style>
  :root { --bg: #f7f3ea; --text: #2b2118; --muted: #6b5d4f; --accent: #8a4b12; --card: #fffdf8; --line: #e3d8c4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17131f; --text: #ece6da; --muted: #b3a894; --accent: #f0b35a; --card: #211b2b; --line: #3a3147; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .app { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .app img { width: 72px; height: 72px; border-radius: 16px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Gabriel Carlos</h1>
<p class="muted">Apps e jogos para Android.</p>
<div class="app">
  <img src="realmforge/icone.png" alt="Ícone do Realmforge">
  <div>
    <strong>Realmforge: Torres e Gemas</strong><br>
    Tower defense com puzzle de combinar gemas.<br>
    <a href="realmforge/privacidade/">Política de privacidade</a>
  </div>
</div>
<p class="muted">Contato: <a href="mailto:gabrielcarllos@yahoo.com.br">gabrielcarllos@yahoo.com.br</a></p>
</main>
</body>
</html>
